# MetroScan — Render Blueprint, step A (deploys from GitHub: vishwa-vup/metroscan-final, branch main)
# Transitional state: API only. The old static metroscan-web is removed here so
# step B can recreate the name as the all-in-one Docker service (Render forbids
# changing a service's type in place). Never commit secrets.
services:
  - type: web
    name: metroscan-api
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Supabase pooler URL already set in dashboard; kept, not recreated
      - key: JWT_SECRET
        sync: false # keep existing generated secret; do not regenerate
      - key: CORS_ORIGINS
        value: https://metroscan-web.onrender.com
